<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rare — a community archive of rare photos, videos &amp; notes</title>
<meta name="description" content="Rare — a community archive of rare photos, videos and notes, plus the Other Side Collection. Scroll sideways between pages.">
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%0A%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23b32424%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237a1f7a%22/%3E%0A%20%20%3C/linearGradient%3E%3C/defs%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22url%28%23g%29%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2240%22%20fill%3D%22%23ffffff%22%20text-anchor%3D%22middle%22%3ER%3C/text%3E%0A%3C/svg%3E%0A" type="image/svg+xml">
<style>
/* Rare — clean, Wikipedia-like light theme */
:root{
  --bg:#ffffff;
  --panel:#f8f9fa;
  --panel-2:#f1f3f5;
  --border:#c8ccd1;
  --border-soft:#eaecf0;
  --text:#202122;
  --muted:#54595d;
  --link:#3366cc;
  --link-visited:#6b4ba3;
  --rare:#b32424;
  --rare-soft:#fdecec;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--serif);font-weight:normal;line-height:1.3;margin:0 0 .5em}
h1{font-size:1.9rem;border-bottom:1px solid var(--border);padding-bottom:.25em}
h2{font-size:1.4rem;border-bottom:1px solid var(--border-soft);padding-bottom:.2em;margin-top:1.6em}
h3{font-size:1.15rem}
p{margin:.6em 0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

/* ---------- Header ---------- */
.site-header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;gap:22px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.5rem;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand-mark{
  width:38px;height:38px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(140deg,#b32424,#7a1f7a);color:#fff;font-weight:bold;
  font-family:var(--serif);font-size:1.35rem;box-shadow:0 2px 6px rgba(0,0,0,.15)
}
.brand small{display:block;font-family:var(--sans);font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-top:-3px}

.search-form{position:relative;flex:1;max-width:620px;display:flex}
.search-form input[type=search]{
  flex:1;padding:9px 12px;font-size:.95rem;border:1px solid var(--border);
  border-right:none;border-radius:3px 0 0 3px;background:#fff;color:var(--text);outline:none
}
.search-form input[type=search]:focus{border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
.search-form button{
  padding:9px 16px;border:1px solid var(--link);background:var(--link);color:#fff;
  border-radius:0 3px 3px 0;cursor:pointer;font-size:.9rem
}
.search-form button:hover{background:#2a56ab}
.suggest{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
  border:1px solid var(--border);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.14);
  overflow:hidden;display:none;z-index:60
}
.suggest.open{display:block}
.suggest a{display:flex;gap:10px;align-items:center;padding:8px 12px;color:var(--text);font-size:.9rem}
.suggest a:hover,.suggest a.active{background:var(--panel);text-decoration:none}
.suggest .s-type{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:#fff;
  background:var(--muted);border-radius:3px;padding:1px 6px;flex:0 0 auto}
.suggest .s-type.photo{background:#0b6e4f}
.suggest .s-type.video{background:#b32424}
.suggest .s-type.note{background:#4a5568}
.suggest .s-empty{padding:10px 12px;color:var(--muted);font-size:.9rem}

.main-nav{border-top:1px solid var(--border-soft);display:flex;flex-wrap:wrap;gap:2px;padding:4px 0}
.main-nav a{
  padding:7px 12px;font-size:.9rem;color:var(--text);border-radius:3px
}
.main-nav a:hover{background:var(--panel);text-decoration:none}
.main-nav a.active{background:var(--rare-soft);color:var(--rare);font-weight:600}

/* ---------- Category chips ---------- */
.cat-strip{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{
  font-size:.82rem;padding:4px 12px;border:1px solid var(--border);border-radius:999px;
  color:var(--text);background:#fff
}
.chip:hover{border-color:var(--link);color:var(--link);text-decoration:none}
.chip.active{background:var(--link);border-color:var(--link);color:#fff}

/* ---------- Layout ---------- */
.layout{display:grid;grid-template-columns:1fr 260px;gap:34px;align-items:start;padding:22px 0 40px}
.layout.full{grid-template-columns:1fr}
main{min-width:0}
.sidebar{position:sticky;top:130px}
.side-box{border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:18px;background:var(--panel)}
.side-box h3{font-family:var(--sans);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);margin-bottom:.6em;border:none;padding:0}
.side-box ul{list-style:none;margin:0;padding:0}
.side-box li{margin:5px 0;font-size:.9rem}
.lead{font-size:1.02rem;color:var(--muted)}

/* ---------- Cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:18px}
.card{
  border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;
  display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s
}
.card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
.card .thumb{position:relative;aspect-ratio:16/10;background:var(--panel-2);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .badge{
  position:absolute;top:8px;left:8px;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.07em;color:#fff;padding:2px 8px;border-radius:3px;background:var(--muted)
}
.badge.photo{background:#0b6e4f}
.badge.video{background:#b32424}
.badge.note{background:#4a5568}
.card .body{padding:12px 14px 16px;display:flex;flex-direction:column;flex:1}
.card .cat{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--rare);margin-bottom:4px}
.card h3{font-size:1.02rem;margin:0 0 6px;font-family:var(--serif)}
.card h3 a{color:var(--text)}
.card h3 a:hover{color:var(--link);text-decoration:none}
.card p{font-size:.86rem;color:var(--muted);margin:0 0 10px;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:.74rem;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--border-soft);padding-top:8px}

/* ---------- Item detail ---------- */
.detail-head{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.detail-figure{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:18px 0;background:var(--panel-2)}
.detail-figure img{width:100%}
.detail-figure figcaption{font-size:.8rem;color:var(--muted);padding:8px 12px;background:var(--panel)}
.video-frame{position:relative;aspect-ratio:16/9;background:#111;display:grid;place-items:center}
.video-frame .play{
  width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;
  font-size:1.6rem;color:#111;box-shadow:0 4px 18px rgba(0,0,0,.4)
}
.meta-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:.9rem}
.meta-table th,.meta-table td{border:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
.meta-table th{background:var(--panel);width:180px;font-weight:600;color:var(--muted)}

/* ---------- Forms ---------- */
.form-grid{display:grid;gap:14px;max-width:640px}
.field label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:4px;
  font-family:inherit;font-size:.92rem;background:#fff;color:var(--text)
}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 2px rgba(51,102,204,.15)}
.btn{display:inline-block;background:var(--rare);color:#fff;border:none;padding:10px 22px;border-radius:4px;
  cursor:pointer;font-size:.95rem;font-family:inherit}
.btn:hover{background:#8f1c1c}
.btn.ghost{background:#fff;color:var(--link);border:1px solid var(--link)}
.btn.ghost:hover{background:var(--panel)}
.notice{border-left:4px solid var(--link);background:#eaf3ff;padding:12px 16px;border-radius:0 6px 6px 0;font-size:.9rem;margin:16px 0}

/* ---------- Hero ---------- */
.hero{border:1px solid var(--border);border-radius:10px;padding:26px 28px;background:
  linear-gradient(135deg,#fff 0%,#faf6f6 55%,#f6f2fa 100%);margin-top:18px}
.hero h1{border:none;font-size:2.15rem;margin-bottom:.15em}
.hero .kicker{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rare);font-weight:600}
.hero-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.stat-row{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.stat b{font-family:var(--serif);font-size:1.6rem;display:block}
.stat span{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* ---------- Footer ---------- */
.site-footer{border-top:1px solid var(--border);background:var(--panel);margin-top:40px;padding:28px 0 34px;font-size:.88rem;color:var(--muted)}
.footer-cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:26px}
.footer-cols h4{font-family:var(--sans);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text);margin-bottom:.7em}
.footer-cols ul{list-style:none;margin:0;padding:0}
.footer-cols li{margin:5px 0}
.footer-bottom{margin-top:22px;border-top:1px solid var(--border-soft);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.wa{display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;padding:7px 14px;border-radius:6px;font-size:.85rem}
.wa:hover{text-decoration:none;background:#1ebe5b}
.mail{display:inline-flex;align-items:center;gap:7px;background:var(--rare);color:#fff;padding:7px 14px;border-radius:6px;font-size:.85rem}
.mail:hover{text-decoration:none;background:#8f1c1c}

.section-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px}
.section-head .more{font-size:.85rem}
.tagline{color:var(--muted);font-size:.95rem}
.small{font-size:.82rem;color:var(--muted)}
hr{border:none;border-top:1px solid var(--border-soft);margin:22px 0}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static}
  .footer-cols{grid-template-columns:1fr 1fr}
  .header-top{flex-wrap:wrap;gap:12px}
  .search-form{max-width:none;order:3;flex-basis:100%}
}
@media(max-width:520px){
  .footer-cols{grid-template-columns:1fr}
  h1{font-size:1.55rem}
  .hero h1{font-size:1.7rem}
}

/* ---------- Other Side Collection ---------- */
.collection-hero{display:flex;gap:20px;align-items:center;border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;background:linear-gradient(135deg,#fff 0%,#faf6f6 55%,#f4f0fa 100%);margin-top:18px}
.collection-hero img{width:74px;height:74px;flex:0 0 auto}
.collection-hero h1{border:none;margin:0 0 .1em;font-size:1.9rem}
.platform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.platform{display:flex;gap:13px;align-items:center;border:1px solid var(--border);border-radius:8px;
  padding:14px;background:#fff;color:var(--text);transition:box-shadow .15s,transform .15s}
.platform:hover{text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.12);transform:translateY(-2px);border-color:var(--pc,#4a5568)}
.platform .p-icon{width:44px;height:44px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
  font-size:1.25rem;font-weight:700;color:#fff;background:var(--pc,#4a5568)}
.platform .p-body b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--text)}
.platform .p-body small{color:var(--muted);font-size:.82rem;line-height:1.4;display:block;margin-top:2px}
.platform .ext{font-size:.78rem;color:var(--muted);margin-left:5px}
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:18px}
.yt-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.yt-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.13);transform:translateY(-2px)}
.yt-thumb{position:relative;display:block;aspect-ratio:16/9;background:#000}
.yt-thumb img{width:100%;height:100%;object-fit:cover}
.yt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;
  border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:1.1rem;pointer-events:none}
.yt-body{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.yt-body h3{font-size:1rem;margin:0 0 6px;font-family:var(--serif)}
.yt-body p{font-size:.85rem;color:var(--muted);flex:1;margin:0 0 10px}
.link-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:14px 0 8px}
.link-card{position:relative;display:block;border:1px solid var(--border);border-radius:8px;padding:14px 16px;background:#fff;color:var(--text)}
.link-card:hover{text-decoration:none;border-color:var(--link);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.link-card b{display:block;font-family:var(--serif);font-size:1rem;color:var(--link);margin-bottom:3px}
.link-card small{color:var(--muted);font-size:.82rem;line-height:1.45}
.link-card .ext{position:absolute;top:12px;right:14px;color:var(--muted);font-size:.8rem}
@media(max-width:520px){
  .collection-hero{flex-direction:column;align-items:flex-start;text-align:left}
}

/* ================= Horizontal-scroll shell ================= */
html,body{height:100%}
body.shell{overflow:hidden;display:flex;flex-direction:column;height:100vh}
body.shell #site-header{flex:0 0 auto;z-index:60}

/* three-tier header */
.tier1{display:flex;align-items:center;gap:18px;padding:9px 0}
.tier2{display:flex;align-items:center;gap:4px;border-top:1px solid var(--border-soft);padding:3px 0}
.tier3{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border-soft);padding:5px 0}
.tier-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  flex:0 0 auto;padding-right:6px;border-right:1px solid var(--border-soft);margin-right:4px}
.tier2 a{padding:7px 13px;font-size:.92rem;color:var(--text);border-radius:3px;white-space:nowrap}
.tier2 a:hover{background:var(--panel);text-decoration:none}
.tier2 a.active{background:var(--rare-soft);color:var(--rare);font-weight:600}

/* horizontally scrolling category strip (tier 3) */
.cat-strip{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;
  -ms-overflow-style:none;margin:0;padding:2px 0}
.cat-strip::-webkit-scrollbar{height:0}
.cat-strip .chip{flex:0 0 auto;scroll-snap-align:start}
.strip-nav{flex:0 0 auto;width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:50%;
  cursor:pointer;color:var(--muted);display:grid;place-items:center;font-size:1rem;line-height:1;padding:0}
.strip-nav:hover{border-color:var(--link);color:var(--link)}

/* track + panels */
.track{flex:1 1 auto;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  scroll-behavior:smooth;position:relative;scrollbar-width:none}
.track::-webkit-scrollbar{height:0}
.panel{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;
  scroll-snap-stop:always;padding-bottom:48px;position:relative}
.panel::-webkit-scrollbar{width:10px}
.panel::-webkit-scrollbar-thumb{background:#c8ccd1;border-radius:8px;border:3px solid #fff}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--rare);font-weight:600}
.scroll-hint{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}

/* horizontal card rows */
.row-wrap{position:relative}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 2px 14px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
.row::-webkit-scrollbar{height:8px}
.row::-webkit-scrollbar-thumb{background:#c8ccd1;border-radius:8px}
.row .card{flex:0 0 300px;scroll-snap-align:start}
.row .platform{flex:0 0 250px}
.row-arrow{position:absolute;top:38%;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:#fff;color:var(--text);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3;
  display:grid;place-items:center;font-size:1.05rem;line-height:1}
.row-arrow:hover{border-color:var(--link);color:var(--link)}
.row-arrow.l{left:-10px}.row-arrow.r{right:-10px}

/* big panel arrows */
.nav-arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:65;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--border);background:rgba(255,255,255,.92);color:var(--text);cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.14);display:grid;place-items:center;font-size:1.4rem;line-height:1}
.nav-arrow:hover{border-color:var(--link);color:var(--link)}
.nav-arrow.prev{left:12px}.nav-arrow.next{right:12px}

/* progress dots */
.dots{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:64;display:flex;gap:8px;
  background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:999px;padding:6px 12px}
.dots button{width:9px;height:9px;border-radius:50%;border:none;background:#c8ccd1;cursor:pointer;padding:0}
.dots button.active{background:var(--rare);transform:scale(1.25)}

/* slide-in sheet (overlay) */
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;overflow-y:auto;z-index:70;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-10px 0 34px rgba(0,0,0,.16)}
.sheet.open{transform:none}
.sheet-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:10px 0;z-index:2}
.sheet-bar .wrap{display:flex;align-items:center;gap:14px}
.sheet-back{border:1px solid var(--border);background:#fff;border-radius:4px;padding:6px 14px;cursor:pointer;
  font-family:inherit;font-size:.88rem;color:var(--text)}
.sheet-back:hover{border-color:var(--link);color:var(--link)}

@media(max-width:900px){
  .nav-arrow{display:none}
  .tier2 a{padding:7px 9px;font-size:.85rem}
}
@media(max-width:620px){
  .tier-label{display:none}
  .row .card{flex:0 0 78%}
  .row .platform{flex:0 0 78%}
}
@media(prefers-reduced-motion:reduce){
  .sheet{transition:none}
  .track{scroll-behavior:auto}
}

</style>
</head>
<body class="shell">
<header class="site-header" id="site-header"></header>
<div class="track" id="track"></div>
<button class="nav-arrow prev" id="arrow-prev" aria-label="Previous page">&#8249;</button>
<button class="nav-arrow next" id="arrow-next" aria-label="Next page">&#8250;</button>
<div class="sheet" id="sheet"></div>
<script>
/* Rare — content data model.
   Anyone contributing adds an entry here (or sends it in via the Submit form).
   type:    "photo" | "video" | "note"
   category: one of the six real categories (Recent is derived automatically)
   addedHoursAgo: hours since it was published — drives the "Recent (24h)" view
*/
window.RARE_SITE = {
  brand: "Rare",

  function esc(s) {

      .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      '<text x="40" y="' + y0 + '" fill="#ffffff" font-family="Georgia,serif" font-size="30">' + tspan + "</text>" +
      '<rect x="40" y="330" width="150" height="34" rx="4" fill="' + type + '"/><text x="115" y="353" fill="#ffffff" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="18" letter-spacing="2">' + esc(TYPE_LABEL[it.type]) + "</text></svg>";

      '<div class="wrap layout"><main>' +

"btn" href="#otherside">Open the Other Side &rarr;</a></div></section>' +

  function pType(type, title, kicker, lead) {

  function pAbout() {
    return '<div class="wrap layout"><main><div class="panel-kicker">About</div><h1>About Us</h1>' +
      '<p class="lead">Rare is a community archive of the hard-to-find. It works a little like Wikipedia \u2014 open, explained for newcomers, and <b>anyone can contribute</b>.</p>' +

  function pOtherside() {

      '<a class="card" style="text-decoration:none" href="#open:youtube"><div class="body"><div class="cat">Other Side &middot; YouTube</div><h3>10 rare videos</h3><p>From the oldest surviving film of 1888 to lost 1984 footage \u2014 real, watchable, rare.</p><div class="meta"><span>By link</span><span>Open &rarr;</span></div></div></a>' +
      '<a class="card" style="text-decoration:none" href="#open:wikipedia"><div class="body"><div class="cat">Other Side &middot; Wikipedia</div><h3>Pages &amp; images</h3><p>Rare pages on lost media and rediscovered films, plus free historical images.</p><div class="meta"><span>Pages + images</span><span>Open &rarr;</span></div></div></a>' +

      "</main>" + sidebar() + "</div>";

  /* ---------- sheets ---------- */
  var sheet;
  function sheetShell(title, body) {
    return '<div class="sheet-bar"><div class="wrap"><button class="sheet-back" id="sheet-back">\u2039 Back</button><b style="font-family:Georgia,serif;font-size:1.05rem">' + esc(title) + "</b></div></div>" +
      '<div class="wrap" style="padding-top:18px;padding-bottom:60px">' + body + "</div>";

  function openSheet(title, body) {
    sheet.innerHTML = sheetShell(title, body);

    sheet.scrollTop = 0;
    var b = document.getElementById("sheet-back");
    if (b) b.addEventListener("click", closeSheet);
    wireRows(sheet);
  }
  function closeSheet() { sheet.classList.remove("open"); sheet.innerHTML = ""; }

  function openItem(id) {
    var it = byId(id);
    if (!it) return openSheet("Not found", "<p>This entry may have moved.</p>");
    var media = "";
    if (it.type === "photo") media = '<figure class="detail-figure"><img src="' + thumb(it) + '" alt="' + esc(it.title) + '"><figcaption>' + esc(it.title) + " \u00b7 " + esc(it.source) + "</figcaption></figure>";
    else if (it.type === "video") media = '<figure class="detail-figure"><div class="video-frame"><div class="play">\u25B6</div></div><figcaption>Video entry \u00b7 placeholder player.</figcaption></figure>';
    var rel = ITEMS.filter(function (x) { return x.category === it.category && x.id !== it.id; }).slice(0, 6);
    openSheet(it.title,
      '<div class="detail-head"><h1 style="border:none;margin:0">' + esc(it.title) + '</h1><span class="badge ' + it.type + '" style="position:static">' + TYPE_LABEL[it.type] + "</span></div>" +
      '<p class="lead">' + esc(it.summary) + "</p>" + media +
      '<table class="meta-table"><tr><th>Type</th><td>' + TYPE_LABEL[it.type] + "</td></tr><tr><th>Category</th><td>" + esc(it.category) + "</td></tr>" +
      "<tr><th>Origin</th><td>" + esc(it.place || "\u2014") + "</td></tr><tr><th>Source</th><td>" + esc(it.source) + "</td></tr><tr><th>Added</th><td>" + timeAgo(it.addedHoursAgo) + "</td></tr></table>" +
      "<h2>Notes</h2><p>" + esc(it.body) + "</p>" +
      (rel.length ? "<h2>More in " + esc(it.category) + "</h2>" + row(rel) : ""));
  }
  function openCategory(key) {
    var meta = CATS.filter(function (c) { return c.key === key; })[0] || CATS[0];
    var list = (key === "Recent") ? ITEMS.filter(isRecent) : ITEMS.filter(function (it) { return it.category === key; });

  }
  function openSearch(q) {

    openSheet("Search the archive",
      '<form class="search-form" id="sheet-search" role="search" style="max-width:720px;margin:0 0 14px"><input type="search" id="sheet-q" value="' + esc(q) + '" placeholder="Search rare photos, videos and notes\u2026"><button type="submit">Search</button></form>' +
      '<p class="tagline">' + (q ? "<b>" + res.length + "</b> result" + (res.length === 1 ? "" : "s") + " for \u201c" + esc(q) + "\u201d" : "Type a word \u2014 try \u201cprototype\u201d, \u201cdemo\u201d, \u201cmap\u201d or \u201clost\u201d.") + "</p>" + (q ? grid(res) : ""));
    var f = document.getElementById("sheet-search");

  function openYoutube() {

      '<p class="small"><b>' + COL.youtube.length + '</b> rare videos \u2014 scroll the row \u2192</p>' +
      '<div class="row-wrap"><button class="row-arrow l">\u2039</button><div class="row">' + COL.youtube.map(function (v) { return '<div style="flex:0 0 300px">' + videoCard(v) + "</div>"; }).join("") + '</div><button class="row-arrow r">\u203a</button></div>' +
      "<h2>All videos</h2><div class=\"yt-grid\">" + COL.youtube.map(videoCard).join("") + "</div>" +
      '<div class="notice">External YouTube links \u2014 if a video is removed by its owner the link may stop working.</div>');

  function openWikipedia() {
    openSheet("Other Side \u201a Wikipedia", '<p class="lead">Wikipedia is the closest thing to Rare\u2019s own spirit \u2014 free, open and written by everyone.</p>' +
      '<h2>Pages</h2><div class="link-grid">' + COL.wikipedia.pages.map(linkCard).join("") + "</div>" +
      '<h2>Images</h2><div class="link-grid">' + COL.wikipedia.images.map(linkCard).join("") + "</div>");

  /* ---------- search ---------- */
  function score(it, q) {
    var t = (it.title + " " + it.summary + " " + it.body + " " + it.category + " " + it.source + " " + (it.place || "")).toLowerCase();
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean), total = 0;
    for (var i = 0; i < terms.length; i++) {
      if (t.indexOf(terms[i]) === -1) return 0;
      if (it.title.toLowerCase().indexOf(terms[i]) !== -1) total += 5;
      if (it.category.toLowerCase().indexOf(terms[i]) !== -1) total += 3;
      if (it.summary.toLowerCase().indexOf(terms[i]) !== -1) total += 2;
      total += 1;
    }
    return total;
  }
  function search(q) {
    q = (q || "").trim(); if (!q) return [];
    return ITEMS.map(function (it) { return { it: it, s: score(it, q) }; }).filter(function (r) { return r.s > 0; })
      .sort(function (a, b) { return b.s - a.s; }).map(function (r) { return r.it; });
  }

  /* ---------- wiring ---------- */
  var track, panels = [], idx = 0;
  function panelIndex(key) { for (var i = 0; i < PANELS.length; i++) if (PANELS[i][0] === key) return i; return 0; }
  function goTo(key) {
    idx = panelIndex(key);
    track.scrollTo({ left: idx * track.clientWidth, behavior: "smooth" });
    syncNav(idx);
  }
  function syncNav(i) {
    var links = document.querySelectorAll(".tier2 a");
    for (var k = 0; k < links.length; k++) links[k].classList.toggle("active", k === i);
    var dots = document.querySelectorAll(".dots button");
    for (var d = 0; d < dots.length; d++) dots[d].classList.toggle("active", d === i);
  }
  function currentIndex() { return Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); }

  function wireRows(scope) {
    var wraps = (scope || document).querySelectorAll(".row-wrap");
    for (var i = 0; i < wraps.length; i++) {
      (function (w) {
        var r = w.querySelector(".row"), l = w.querySelector(".row-arrow.l"), rr = w.querySelector(".row-arrow.r");
        if (!r) return;
        if (l) l.addEventListener("click", function () { r.scrollBy({ left: -r.clientWidth * 0.85, behavior: "smooth" }); });
        if (rr) rr.addEventListener("click", function () { r.scrollBy({ left: r.clientWidth * 0.85, behavior: "smooth" }); });
      })(wraps[i]);
    }
  }
  function wireHeader() {
    var strip = document.getElementById("cat-strip");
    var sl = document.getElementById("strip-l"), sr = document.getElementById("strip-r");
    if (sl) sl.addEventListener("click", function () { strip.scrollBy({ left: -180, behavior: "smooth" }); });
    if (sr) sr.addEventListener("click", function () { strip.scrollBy({ left: 180, behavior: "smooth" }); });

    var form = document.getElementById("search-form"), input = document.getElementById("global-search"), box = document.getElementById("suggest");
    if (form) form.addEventListener("submit", function (e) { e.preventDefault(); openSearch(input.value.trim()); });
    if (input && box) {
      input.addEventListener("input", function () {
        var q = input.value.trim();
        if (q.length < 2) { box.classList.remove("open"); box.innerHTML = ""; return; }
        var hits = search(q).slice(0, 6);
        if (!hits.length) { box.innerHTML = '<div class="s-empty">No matches for \u201c' + esc(q) + '\u201d</div>'; box.classList.add("open"); return; }
        box.innerHTML = hits.map(function (it) {
          return '<a href="#item:' + encodeURIComponent(it.id) + '"><span class="s-type ' + it.type + '">' + TYPE_LABEL[it.type] + "</span><span>" + esc(it.title) + " <span style='color:#72777d'>\u00b7 " + esc(it.category) + "</span></span></a>";
        }).join("");
        box.classList.add("open");
      });
      document.addEventListener("click", function (e) { if (!form.contains(e.target)) { box.classList.remove("open"); } });
    }
  }
  function wireAboutForm() {
    var form = document.getElementById("submit-form"); if (!form) return;
    var status = document.getElementById("form-status");
    form.addEventListener("submit", function (e) {
      if (!form.checkValidity()) { e.preventDefault(); form.reportValidity(); return; }
      e.preventDefault();
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
      var body = "Name: " + g("f-name") + "\nEmail: " + g("f-email") + "\nType: " + g("f-type") + "\nCategory: " + g("f-cat") +
        "\nTitle: " + g("f-title") + "\nLink/source: " + g("f-link") + "\n\nNotes:\n" + g("f-notes") + "\n";
      status.textContent = "Opening your email app to send this to " + S.email + "\u2026";
      location.href = "mailto:" + S.email + "?subject=" + encodeURIComponent("Rare submission: " + (g("f-title") || "new find")) + "&body=" + encodeURIComponent(body);
    });
  }

  function route() {
    var h = (location.hash || "").replace(/^#/, "");
    if (h.indexOf("item:") === 0) return openItem(decodeURIComponent(h.slice(5)));
    if (h.indexOf("cat:") === 0) return openCategory(decodeURIComponent(h.slice(4)));
    if (h.indexOf("open:") === 0) {
      var k = h.slice(5);
      if (k === "youtube") return openYoutube();
      if (k === "wikipedia") return openWikipedia();
      if (k === "search") return openSearch("");
      if (k === "otherside") return goTo("otherside");
    }
    if (h) { closeSheet(); return goTo(h); }
    closeSheet();
  }

  function init() {
    var header = document.getElementById("site-header");
    track = document.getElementById("track");
    sheet = document.getElementById("sheet");
    header.innerHTML = headerHTML("home");

    var frag = "";
    frag += '<section class="panel" data-key="home">' + pHome() + "</section>";
    frag += '<section class="panel" data-key="videos">' + pType("video", "Rare Videos", "Videos", "Footage worth preserving \u2014 deleted scenes, lost demos, unreleased prototypes and newsreels.") + "</section>";
    frag += '<section class="panel" data-key="notes">' + pType("note", "Rare Notes", "Notes", "Written things that survived by accident \u2014 notebooks, shot lists, lyric drafts and field reports.") + "</section>";
    frag += '<section class="panel" data-key="images">' + pType("photo", "Rare Photos", "Images", "Photographs that are hard to find and easy to lose \u2014 lantern slides, maps, prototypes and archives.") + "</section>";
    frag += '<section class="panel" data-key="about">' + pAbout() + "</section>";
    frag += '<section class="panel" data-key="otherside">' + pOtherside() + "</section>";
    track.innerHTML = frag;

    /* dots */
    var dots = document.createElement("div");
    dots.className = "dots";
    dots.innerHTML = PANELS.map(function (p, i) { return '<button data-i="' + i + '" aria-label="' + p[1] + '"' + (i === 0 ? ' class="active"' : "") + "></button>"; }).join("");
    document.body.appendChild(dots);
    dots.addEventListener("click", function (e) { if (e.target.dataset.i != null) goTo(PANELS[+e.target.dataset.i][0]); });

    wireHeader();
    wireRows(document);
    wireAboutForm();
    setHeaderHeight();

    var prev = document.getElementById("arrow-prev"), next = document.getElementById("arrow-next");
    if (prev) prev.addEventListener("click", function () { goTo(PANELS[Math.max(0, currentIndex() - 1)][0]); });
    if (next) next.addEventListener("click", function () { goTo(PANELS[Math.min(PANELS.length - 1, currentIndex() + 1)][0]); });

    track.addEventListener("scroll", function () { syncNav(currentIndex()); }, { passive: true });

    /* vertical wheel at a panel edge -> horizontal scroll */
    track.addEventListener("wheel", function (e) {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      var panel = panelsEl()[currentIndex()];
      if (!panel) return;
      var atTop = panel.scrollTop <= 1;
      var atBottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 1;
      if ((e.deltaY > 0 && atBottom) || (e.deltaY < 0 && atTop)) { e.preventDefault(); track.scrollLeft += e.deltaY; }
    }, { passive: false });

    document.addEventListener("keydown", function (e) {
      if (sheet && sheet.classList.contains("open")) { if (e.key === "Escape") closeSheet(); return; }
      var tag = (e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if (e.key === "ArrowRight") goTo(PANELS[Math.min(PANELS.length - 1, currentIndex() + 1)][0]);
      if (e.key === "ArrowLeft") goTo(PANELS[Math.max(0, currentIndex() - 1)][0]);
    });

    window.addEventListener("resize", function () {
      setHeaderHeight();
      track.scrollTo({ left: currentIndex() * track.clientWidth });
    });

    window.addEventListener("hashchange", route);
    route();
    if (!location.hash) syncNav(0);
  }
  function panelsEl() { return track.querySelectorAll(".panel"); }
  function setHeaderHeight() {
    var h = document.getElementById("site-header").offsetHeight;
    document.documentElement.style.setProperty("--hdr", h + "px");
    if (sheet) sheet.style.top = h + "px";
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
